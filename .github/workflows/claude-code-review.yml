name: Claude Code review

# Reviews every pull request from this repository on open and on every push,
# and posts the findings as inline comments plus a summary comment.
#
# WHY our own command (.claude/commands/pr-review.md) instead of the
# code-review plugin: the plugin stops once Claude has commented on a PR, so a
# fix pushed after the first review was never reviewed again. Ours reviews
# each new head commit and skips issues already raised, so push -> review ->
# fix -> review repeats until a round finds nothing new.
#
# WHY Agent, Read, Grep and Glob in --allowedTools: without them every run
# from Oct 2026 to Nov 14 was one Sonnet pass of about 6 turns and 20 s that
# never started the subagents /pr-review asks for and could not read code
# outside the diff, so it nearly always said "No issues found" while Codex
# found real bugs (manuelfessen/dun#445). Task is the older name of the Agent tool.
#
# Authenticates with the Claude subscription token from `claude setup-token`,
# stored as the CLAUDE_CODE_OAUTH_TOKEN secret.
# Same file in every manuelfessen repository; change it in all of them together.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Secrets are withheld from fork pull requests, so review only our own branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Job-level so a newer push cancels the review of the older commit.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Four reviewers plus a check per finding take several minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this for a Claude GitHub App token, which posts the comments.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        env:
          # WHY: Claude Code starts a subagent in the background, or moves a
          # slow one there, and then ends the main turn to wait. The action
          # takes that first turn end as the end of the run, so
          # manuelfessen/dun#447 and #448 (Nov 16, 2026) stopped after 4 turns
          # and 12 s with the reviewers still running and no comment posted.
          # This keeps every agent in the foreground, so the main turn waits
          # for each report.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools must name the inline-comment tool here, or the action
          # never starts the MCP server that posts the comments.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Agent,Task,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
