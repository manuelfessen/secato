name: Claude Code review

# Reviews every pull request from this repository with Claude Code's
# code-review plugin and posts the findings as inline comments, or one summary
# comment when it finds nothing. Authenticates with the Claude subscription
# token from `claude setup-token`, stored as the CLAUDE_CODE_OAUTH_TOKEN secret.
# Same file in every manuelfessen repository; change it in all of them together.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Secrets are withheld from fork pull requests, so review only our own branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Job-level so a newer push cancels the review of the older commit.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this for a Claude GitHub App token, which posts the comments.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools must name the inline-comment tool here, or the action
          # never starts the MCP server that posts the comments.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
